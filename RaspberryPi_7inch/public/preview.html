<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Assist — Kiểm tra kích thước</title><style>body{margin:0;background:#e9efeb;color:#172c27;font:15px system-ui}header{padding:16px;background:white;display:flex;align-items:center;gap:16px;flex-wrap:wrap}select,a{font:inherit;min-height:48px;padding:10px;color:#155d50}iframe{display:block;border:1px solid #b9cec1;margin:20px auto;background:white}main{width:max-content;min-width:100%}</style><header><strong>Khung kiểm tra giao diện thật</strong><label for="size">Kích thước</label><select id="size"></select><a href="/">Mở ứng dụng trực tiếp</a><span>Giữ zoom 100%. Mọi thao tác dùng dữ liệu máy chủ thật.</span></header><main><iframe title="Ứng dụng Sign Assist" src="/#home" allow="microphone; fullscreen"></iframe></main><script>const sizes={"1024x600": [1024, 600], "800x480": [800, 480]};const select=document.getElementById('size');for(const key of Object.keys(sizes))select.add(new Option(key,key));const requested=new URLSearchParams(location.search).get('size');if(Object.hasOwn(sizes,requested))select.value=requested;function resize(){const [w,h]=sizes[select.value];const frame=document.querySelector('iframe');frame.width=w;frame.height=h;history.replaceState(null,'','?size='+select.value)}select.onchange=resize;resize();</script></html>
